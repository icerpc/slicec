name: Build Release

on:
  workflow_call:
    inputs:
      quality:
        required: true
        type: string
      authenticode_sign:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      quality:
        description: "Release quality (e.g., stable, nightly, RC)"
        required: true
        default: "nightly"
      authenticode_sign:
        description: "Sign the Windows binary with Authenticode (upstream only; always on for non-nightly releases)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      channel: ${{ steps.get-version.outputs.channel }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get slicec Version
        id: get-version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "slicec") | .version')"

          channel="${version%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: slicec-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            artifact: slicec
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: slicec
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: slicec
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: slicec.exe

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build slicec binary
        run: cargo build --release --target ${{ matrix.target }} -p slicec

      - name: Sign slicec binary
        if: >-
          github.repository == 'icerpc/slicec' &&
          runner.os == 'Windows' &&
          (inputs.authenticode_sign || inputs.quality != 'nightly')
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: zeroc
          certificate-profile-name: zeroc-ice
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\${{ matrix.artifact }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Fail the build rather than upload an unsigned binary when signing is required.
      - name: Verify slicec binary signature
        if: >-
          github.repository == 'icerpc/slicec' &&
          runner.os == 'Windows' &&
          (inputs.authenticode_sign || inputs.quality != 'nightly')
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "target\${{ matrix.target }}\release\${{ matrix.artifact }}"
          if ($signature.Status -ne 'Valid') {
            throw "${{ matrix.artifact }} is not validly signed: $($signature.Status) $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "${{ matrix.artifact }} is signed but not timestamped; the signature would expire with the signing certificate."
          }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slicec-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}


  upload:
    needs: [metadata, build]
    if: github.repository == 'icerpc/slicec'
    runs-on: ubuntu-latest

    steps:
      - name: S3 Upload Path
        shell: bash
        run: |
          if [[ "${{ inputs.quality }}" == "stable" ]]; then
            upload_path="${{ needs.metadata.outputs.channel }}"
          else
            upload_path="${{ inputs.quality }}/${{ needs.metadata.outputs.channel }}"
          fi
          echo "S3_PATH=$upload_path" >> "$GITHUB_ENV"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: slicec-*
          skip-decompress: true
          merge-multiple: true
          path: ./artifacts

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for file in artifacts/slicec-*.zip; do
            aws s3 cp "$file" "s3://zeroc-downloads/icerpc/slicec/${S3_PATH}/"
          done

      - name: Invalidate CloudFront Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ZEROC_DOWNLOAD_DISTRIBUTION_ID }} \
            --paths "/icerpc/slicec/${S3_PATH}/*"
